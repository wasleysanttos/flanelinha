apply plugin: 'com.android.application'
//apply plugin: 'com.google.gms.google-services'

//apply plugin: 'pmd'

android {
    compileSdkVersion 23
    buildToolsVersion '25.0.0'

    defaultConfig {
        applicationId "com.its.wasleysantos.flanelinha"
        minSdkVersion 16
        targetSdkVersion 23
        versionCode 24
        versionName "1.3.4"
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"

        // Enabling multidex support.
//        multiDexEnabled false
    }

    signingConfigs {
        release {
            storeFile file("minha_chave.keystore")
            storePassword System.getenv("KSTOREPWD")
            keyAlias "flanelinha_digital"
            keyPassword System.getenv("KEYPWD")
            v2SigningEnabled false
        }

    }
    buildTypes {
        release {
            minifyEnabled false
//            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release

        }
    }
}

dependencies {
    compile fileTree(include: ['*.jar'], dir: 'libs')
    //    compile 'com.android.support:multidex:1.0.1'

//    compile files('libs/activation.jar')
//    compile files('libs/additionnal.jar')

    //    compile files('libs/mail.jar')

//    compile 'com.google.android.gms:play-services:9.8.0'
    compile 'com.android.support:appcompat-v7:23.4.0'
    compile 'com.android.support:design:23.4.0'
    compile 'com.android.support:support-v4:23.4.0'
    compile 'com.google.android.gms:play-services-base:9.8.0'
    compile 'com.google.android.gms:play-services-identity:9.8.0'
    compile 'com.google.android.gms:play-services-ads:9.8.0'
    compile 'com.google.android.gms:play-services-maps:9.8.0'
    compile 'com.google.android.gms:play-services-location:9.8.0'
    compile 'com.squareup.okhttp:okhttp:2.5.0'
    compile 'com.google.code.gson:gson:2.4'
    testCompile 'junit:junit:4.12'
}
